<body>

    <div class="container">
        <h1>Chat with LM Studio</h1>
        
        <!-- Database Status -->
         <div><button id="setupDbBtn" onclick="setupDatabaseFolder()">Setup Database Folder</button></div>

    <!-- Load sql.js from CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/sql-wasm.js"></script>

    <script>

        // Global variables for database
        let SQL = null;
        let fileHandle = null;
        let dbInitialized = false;

        // Table schema constant to avoid duplication
        const TABLE_SCHEMA = `
            CREATE TABLE IF NOT EXISTS chat_history (
                id INTEGER PRIMARY KEY AUTOINCREMENT,
                date TEXT NOT NULL,
                user_id TEXT NOT NULL,
                computer_os TEXT NOT NULL,
                model TEXT NOT NULL,
                user_input TEXT NOT NULL,
                ollama_response TEXT NOT NULL,
                combo_history TEXT NOT NULL,
                combo_vector TEXT NOT NULL,
                response_time_seconds INTEGER,
                input_tokens INTEGER,
                output_tokens INTEGER,
                created_at DATETIME DEFAULT CURRENT_TIMESTAMP
            )
        `;

        // Initialize sql.js
        async function initDatabase() {
            try {
                if (typeof initSqlJs === 'undefined') {
                    throw new Error('sql.js library not loaded from CDN');
                }
                
                SQL = await initSqlJs({
                    locateFile: file => `https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/${file}`
                });

                // Try to load stored directory handle first
                const storedHandle = await loadDirectoryHandleFromIndexedDB();
                
                if (storedHandle) {
                    try {
                        // Verify the handle is still accessible
                        const permission = await storedHandle.queryPermission({ mode: 'readwrite' });
                        if (permission === 'granted') {
                            fileHandle = storedHandle;
                            console.log('Auto-loading previously saved folder');
                            await loadAndInitializeDatabase();
                            return;
                        }
                    } catch (err) {
                        console.log('Stored handle no longer accessible');
                    }
                }

                // No stored handle or not accessible
                dbInitialized = false;
                updateDbStatus('Folder not selected. Click "Setup Database Folder" to select a folder enable persistent historical auto-save.', 'warning');
                
            } catch (error) {
                console.error('Error initializing sql.js:', error);
                updateDbStatus('Error initializing database: ' + error.message, 'error');
            }
        }

        // Setup database folder using File System Access API
        async function setupDatabaseFolder() {
            try {
                // Check if File System Access API is supported
                if (!('showDirectoryPicker' in window)) {
                    alert('File System Access API is not supported in your browser. Please use Chrome or Edge.');
                    return;
                }
                
                if (!SQL) {
                    alert('Database system not initialized yet. Please wait a moment and try again.');
                    return;
                }
                
                // Try to load stored directory handle first
                let storedHandle = await loadDirectoryHandleFromIndexedDB();
                
                if (storedHandle) {
                    // Try to use the stored handle
                    try {
                        // Verify the handle is still accessible
                        const permission = await storedHandle.queryPermission({ mode: 'readwrite' });
                        if (permission === 'granted') {
                            fileHandle = storedHandle;
                            console.log('Using previously saved folder access');
                            await loadAndInitializeDatabase();
                            return;
                        }
                    } catch (err) {
                        console.log('Stored handle no longer accessible, requesting new folder selection');
                    }
                }
                
                // Prompt user to select the folder
                fileHandle = await window.showDirectoryPicker({
                    mode: 'readwrite'
                });
                
                // Store the new handle in IndexedDB for future use
                await saveDirectoryHandleToIndexedDB(fileHandle);
                
                // Load and initialize with the newly selected folder
                await loadAndInitializeDatabase();
                
            } catch (error) {
                if (error.name === 'AbortError') {
                    console.log('User cancelled folder picker');
                    updateDbStatus('Database not configured. Please restart to set up database.', 'warning');
                } else {
                    console.error('Error setting up database:', error);
                    updateDbStatus('Error setting up database: ' + error.message, 'error');
                    alert('Error setting up database: ' + error.message);
                }
            }
        }

        // Append record to disk database file
        async function appendRecordToDatabase(userInput, lmstudioResponse, responseTime, model, inputTokens, outputTokens, comboVector = '') {
            if (!fileHandle) {
                console.log('No folder handle available');
                return;
            }
            
            try {
                const date = new Date().toISOString().split('T')[0]; // YYYY-MM-DD
                const userId = getUserId();
                const computerOs = getComputerOS();
                const comboHistory = `User: ${userInput}\nAI: ${lmstudioResponse}`;
                
                // Always try to load existing database from disk first
                let db = null;
                let isNewDatabase = false;
                
                try {
                    const fileHandleDb = await fileHandle.getFileHandle('lmstudio_chat_history.db', { create: false });
                    const existingFile = await fileHandleDb.getFile();
                    
                    if (existingFile && existingFile.size > 0) {
                        // Load existing database
                        const arrayBuffer = await existingFile.arrayBuffer();
                        const uint8Array = new Uint8Array(arrayBuffer);
                        db = new SQL.Database(uint8Array);
                        console.log('Loaded existing database from disk');
                    }
                } catch (err) {
                    // File doesn't exist, will create new one
                    console.log('Database file does not exist, will create new one');
                    isNewDatabase = true;
                }
                
                // If no existing database, create new one with table schema
                if (!db) {
                    db = new SQL.Database();
                    db.run(TABLE_SCHEMA);
                    console.log('Created new database with table schema');
                }
                
                // Insert the new record (append only, never replace)
                db.run(
                    `INSERT INTO chat_history (date, user_id, computer_os, model, user_input, ollama_response, combo_history, combo_vector, response_time_seconds, input_tokens, output_tokens)
                     VALUES (?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?)`,
                    [date, userId, computerOs, model, userInput, lmstudioResponse, comboHistory, comboVector, responseTime, inputTokens, outputTokens]
                );
                
                // Export and write back to disk
                const data = db.export();
                const fileHandleDb = await fileHandle.getFileHandle('lmstudio_chat_history.db', { create: true });
                const writer = await fileHandleDb.createWritable();
                await writer.write(data);
                await writer.close();
                
                // Get record count
                const result = db.exec('SELECT COUNT(*) as count FROM chat_history');
                const recordCount = result[0]?.values[0][0] || 0;
                
                // Close the database
                db.close();
                
                console.log(`Record appended to database file (${isNewDatabase ? 'new' : 'existing'})`);
                updateDbStatus(`Auto-saved | Total records: ${recordCount} | Auto-save enabled`, 'success');
                
            } catch (error) {
                console.error('Error appending to database:', error);
                updateDbStatus('Error auto-saving database: ' + error.message, 'error');
            }
        }

        // Load directory handle from IndexedDB
        async function loadDirectoryHandleFromIndexedDB() {
            return new Promise((resolve) => {
                const request = indexedDB.open('lmstudioDB', 1);
                
                request.onsuccess = (event) => {
                    try {
                        const db = event.target.result;
                        const transaction = db.transaction(['folderHandle'], 'readonly');
                        const store = transaction.objectStore('folderHandle');
                        const getRequest = store.get('chatFolderHandle');
                        
                        getRequest.onsuccess = () => {
                            resolve(getRequest.result?.handle || null);
                        };
                        getRequest.onerror = () => resolve(null);
                    } catch (err) {
                        resolve(null);
                    }
                };
                
                request.onerror = () => resolve(null);
                request.onupgradeneeded = (event) => {
                    try {
                        const indexedDB = event.target.result;
                        if (!indexedDB.objectStoreNames.contains('folderHandle')) {
                            indexedDB.createObjectStore('folderHandle');
                        }
                    } catch (err) {
                        console.log('Could not create object store');
                    }
                };
            });
        }

        // Save directory handle to IndexedDB
        async function saveDirectoryHandleToIndexedDB(handle) {
            return new Promise((resolve) => {
                const request = indexedDB.open('lmstudioDB', 1);
                
                request.onsuccess = (event) => {
                    try {
                        const db = event.target.result;
                        const transaction = db.transaction(['folderHandle'], 'readwrite');
                        const store = transaction.objectStore('folderHandle');
                        store.put({ handle: handle }, 'chatFolderHandle');
                        transaction.oncomplete = () => resolve(true);
                        transaction.onerror = () => resolve(false);
                    } catch (err) {
                        resolve(false);
                    }
                };
                
                request.onerror = () => resolve(false);
                request.onupgradeneeded = (event) => {
                    try {
                        const indexedDB = event.target.result;
                        if (!indexedDB.objectStoreNames.contains('folderHandle')) {
                            indexedDB.createObjectStore('folderHandle');
                        }
                    } catch (err) {
                        console.log('Could not create object store');
                    }
                };
            });
        }

        // Load and initialize database from the selected folder
        async function loadAndInitializeDatabase() {
            try {
                // Try to get existing database file (without creating it)
                let fileExists = false;
                let recordCount = 0;
                
                try {
                    const fileHandleDb = await fileHandle.getFileHandle('lmstudio_chat_history.db', { create: false });
                    const file = await fileHandleDb.getFile();
                    
                    if (file && file.size > 0) {
                        fileExists = true;
                        
                        // Load to verify structure and get record count
                        const arrayBuffer = await file.arrayBuffer();
                        const uint8Array = new Uint8Array(arrayBuffer);
                        const testDb = new SQL.Database(uint8Array);
                        
                        // Get record count
                        const result = testDb.exec('SELECT COUNT(*) as count FROM chat_history');
                        recordCount = result[0]?.values[0][0] || 0;
                        testDb.close();
                        
                        console.log(`Database file exists with ${recordCount} records - will append new records only`);
                        updateDbStatus(`Connected to folder | Database exists with ${recordCount} records | Auto-save enabled`, 'success');
                    }
                } catch (err) {
                    // File doesn't exist
                    console.log('Database file does not exist');
                }
                
                // Only create new database if file doesn't exist
                if (!fileExists) {
                    console.log('Creating new database file');
                    await createNewDatabaseFile();
                }
                
            } catch (error) {
                console.error('Error loading database:', error);
                updateDbStatus('Error loading database: ' + error.message, 'error');
            }
            
            dbInitialized = true;
        }

        // Helper function to create new database file (ONLY called when file doesn't exist)
        async function createNewDatabaseFile() {
            const db = new SQL.Database();
            db.run(TABLE_SCHEMA);
            
            const data = db.export();
            const fileHandleDb = await fileHandle.getFileHandle('lmstudio_chat_history.db', { create: true });
            const writer = await fileHandleDb.createWritable();
            await writer.write(data);
            await writer.close();
            
            db.close();
            
            console.log('New database file created');
            updateDbStatus(`Database ready | New database created with 0 records | Auto-save enabled`, 'success');
        }

        // Update database status display
        function updateDbStatus(message, type) {
            const statusDiv = document.getElementById('dbStatus');
            statusDiv.textContent = 'Database: ' + message;
            statusDiv.className = 'db-status ' + type;
        }

        // Save chat to database - appends to disk file
        async function saveChatToDatabase(userInput, lmstudioResponse, responseTime, model, inputTokens, outputTokens, comboVector = '') {
            if (!dbInitialized) {
                console.error('Database not initialized');
                return;
            }
            
            try {
                // Append to disk database file if configured
                if (fileHandle) {
                    await appendRecordToDatabase(userInput, lmstudioResponse, responseTime, model, inputTokens, outputTokens, comboVector);
                } else {
                    console.log('No folder selected - record not saved');
                    updateDbStatus('Record not saved | Select folder for auto-save', 'warning');
                }
                
            } catch (error) {
                console.error('Error saving to database:', error);
                updateDbStatus('Error saving chat: ' + error.message, 'error');
            }
        }

        // Get or create user ID
        function getUserId() {
            let userId = localStorage.getItem('lmstudioUserId');
            if (!userId) {
                userId = 'user_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
                localStorage.setItem('lmstudioUserId', userId);
            }
            return userId;
        }

        // Detect computer OS
        function getComputerOS() {
            const userAgent = navigator.userAgent;
            const platform = navigator.platform;
            
            if (userAgent.indexOf('Win') !== -1) return 'Windows';
            if (userAgent.indexOf('Mac') !== -1) return 'macOS';
            if (userAgent.indexOf('Linux') !== -1) return 'Linux';
            if (userAgent.indexOf('Android') !== -1) return 'Android';
            if (userAgent.indexOf('iOS') !== -1 || userAgent.indexOf('iPhone') !== -1) return 'iOS';
            
            return platform || 'Unknown';
        }

        // Generate embeddings using simple hash-based vectorization
        // This creates a 384-dimensional vector from the text
        function generateEmbeddings(text) {
            try {
                if (!text || text.trim().length === 0) {
                    return null;
                }

                // Normalize text
                const normalizedText = text.toLowerCase().trim();
                
                // Create a simple but effective embedding using character n-grams and word features
                const vectorSize = 384; // Common embedding size
                const vector = new Array(vectorSize).fill(0);
                
                // Split into words
                const words = normalizedText.split(/\s+/);
                
                // Feature 1: Word-based hashing (first 256 dimensions)
                words.forEach((word, idx) => {
                    if (word.length > 0) {
                        // Hash word to multiple positions
                        for (let i = 0; i < 3; i++) {
                            const hash = simpleHash(word + i) % 256;
                            vector[hash] += 1.0 / Math.sqrt(words.length);
                        }
                    }
                });
                
                // Feature 2: Character trigrams (next 128 dimensions)
                for (let i = 0; i < normalizedText.length - 2; i++) {
                    const trigram = normalizedText.substring(i, i + 3);
                    const hash = (simpleHash(trigram) % 128) + 256;
                    vector[hash] += 0.5 / Math.sqrt(normalizedText.length);
                }
                
                // Normalize the vector (L2 normalization)
                const magnitude = Math.sqrt(vector.reduce((sum, val) => sum + val * val, 0));
                if (magnitude > 0) {
                    for (let i = 0; i < vectorSize; i++) {
                        vector[i] = vector[i] / magnitude;
                    }
                }
                
                // Convert to JSON string for storage
                return JSON.stringify(vector);
            } catch (error) {
                console.error('Error generating embeddings:', error);
                return null;
            }
        }

        // Simple hash function for string to number conversion
        function simpleHash(str) {
            let hash = 0;
            for (let i = 0; i < str.length; i++) {
                const char = str.charCodeAt(i);
                hash = ((hash << 5) - hash) + char;
                hash = hash & hash; // Convert to 32-bit integer
            }
            return Math.abs(hash);
        }

        // Calculate cosine similarity between two vectors
        function cosineSimilarity(vec1, vec2) {
            if (!vec1 || !vec2 || vec1.length !== vec2.length) {
                return 0;
            }
            
            let dotProduct = 0;
            let mag1 = 0;
            let mag2 = 0;
            
            for (let i = 0; i < vec1.length; i++) {
                dotProduct += vec1[i] * vec2[i];
                mag1 += vec1[i] * vec1[i];
                mag2 += vec2[i] * vec2[i];
            }
            
            mag1 = Math.sqrt(mag1);
            mag2 = Math.sqrt(mag2);
            
            if (mag1 === 0 || mag2 === 0) {
                return 0;
            }
            
            return dotProduct / (mag1 * mag2);
        }

        // Find similar conversations using vector similarity
        async function findSimilarConversations(queryText, topK = 5, similarityThreshold = 0.3) {
            if (!fileHandle || !dbInitialized) {
                return [];
            }
            
            try {
                // Generate embedding for the query
                const queryEmbeddingStr = generateEmbeddings(queryText);
                if (!queryEmbeddingStr) {
                    console.log('Could not generate query embedding');
                    return [];
                }
                
                const queryVector = JSON.parse(queryEmbeddingStr);
                
                // Load database
                const fileHandleDb = await fileHandle.getFileHandle('lmstudio_chat_history.db', { create: false });
                const file = await fileHandleDb.getFile();
                
                if (!file || file.size === 0) {
                    return [];
                }
                
                const arrayBuffer = await file.arrayBuffer();
                const uint8Array = new Uint8Array(arrayBuffer);
                const historyDb = new SQL.Database(uint8Array);
                
                // Get all records with embeddings
                const results = historyDb.exec(`
                    SELECT id, combo_history, combo_vector
                    FROM chat_history
                    WHERE combo_vector IS NOT NULL AND combo_vector != ''
                    ORDER BY id DESC
                `);
                
                historyDb.close();
                
                if (results.length === 0 || results[0].values.length === 0) {
                    console.log('No records with embeddings found');
                    return [];
                }
                
                // Calculate similarity scores
                const similarities = [];
                for (const record of results[0].values) {
                    const [id, comboHistory, comboVectorStr] = record;
                    
                    if (!comboVectorStr) continue;
                    
                    try {
                        const recordVector = JSON.parse(comboVectorStr);
                        const similarity = cosineSimilarity(queryVector, recordVector);
                        
                        if (similarity >= similarityThreshold) {
                            similarities.push({
                                id,
                                comboHistory,
                                similarity
                            });
                        }
                    } catch (err) {
                        console.log('Error parsing vector for record', id);
                    }
                }
                
                // Sort by similarity (highest first) and take top K
                similarities.sort((a, b) => b.similarity - a.similarity);
                const topResults = similarities.slice(0, topK);
                
                console.log(`Found ${topResults.length} similar conversations (threshold: ${similarityThreshold})`);
                return topResults;
                
            } catch (err) {
                console.log('Error finding similar conversations:', err);
                return [];
            }
        }

        // Initialize database on page load
        window.addEventListener('DOMContentLoaded', async () => {
            await new Promise(resolve => setTimeout(resolve, 500));
            initDatabase();
            checkCurrentModel();
        });

        
        async function checkCurrentModel() {
            const modelDisplayText = document.getElementById('modelDisplayText');
            
            try {
                const response = await fetch('http://localhost:1234/v1/models');
                if (!response.ok) {
                    throw new Error(`Server Error: ${response.status}`);
                }
                const data = await response.json();
                
                // Extract just the currently loaded model
                if (data.data && data.data.length > 0) {
                    const currentModel = data.data[0].id;
                    modelDisplayText.textContent = `Currently Loaded Model: ${currentModel}`;
                } else {
                    modelDisplayText.textContent = 'No models currently loaded';
                }
            } catch (error) {
                modelDisplayText.textContent = `Error loading model info. Make sure LM Studio server is running on port 1234`;
            }
        }

        // Function to clear the textarea
        function clearInput() {
            document.getElementById('prompt').value = '';
        }

        // Function to format date as YYYY.MM.DD
        function formatDate(date) {
            const year = date.getFullYear();
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const day = String(date.getDate()).padStart(2, '0');
            return `${year}.${month}.${day}`;
        }

        // Function to get the next available version number
        function getNextVersionNumber(dateStr) {
            const stored = JSON.parse(localStorage.getItem('promptVersions') || '{}');
            const todaysVersions = stored[dateStr] || [];
            if (todaysVersions.length === 0) {
                return 0;
            }
            return Math.max(...todaysVersions) + 1;
        }

        // Function to track a version number for a date
        function trackVersion(dateStr, versionNumber) {
            const stored = JSON.parse(localStorage.getItem('promptVersions') || '{}');
            if (!stored[dateStr]) {
                stored[dateStr] = [];
            }
            if (!stored[dateStr].includes(versionNumber)) {
                stored[dateStr].push(versionNumber);
            }
            localStorage.setItem('promptVersions', JSON.stringify(stored));
        }

        // Function to save the prompt
        async function savePrompt() {
            try {
                const promptText = document.getElementById('prompt').value.trim();

                if (!promptText) {
                    alert('Please enter a question in the prompt box before saving.');
                    return;
                }

                const selectedModel = 'local-model';
                const today = new Date();
                const dateStr = formatDate(today);
                const baseFilename = `Prompt LM Studio Chat - ${dateStr}`;

                const versionNumber = getNextVersionNumber(dateStr);
                const filename = `${baseFilename} v${versionNumber}.txt`;

                const fileContent = `Title: LM Studio Chat\nModel: ${selectedModel}\nDate: ${dateStr}\n-------------------------------------------\n\n${promptText}`;

                const blob = new Blob([fileContent], { type: 'text/plain' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = filename;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);

                trackVersion(dateStr, versionNumber);

                alert(`Prompt file ready to save as:\n${filename}\n\nYour browser will save this to your Downloads folder by default.`);

            } catch (error) {
                console.error('Error saving prompt:', error);
                alert(`Error saving prompt: ${error.message}`);
            }
        }

        function copyAnswer() {
            const answerDiv = document.getElementById('answerText');
            if (!answerDiv) {
                alert('No answer available to copy.');
                return;
            }
            const answerText = answerDiv.innerText.trim();
            if (!answerText) {
                alert('No answer available to copy.');
                return;
            }
            navigator.clipboard.writeText(answerText)
                .then(() => {
                    alert('Answer copied to clipboard.');
                })
                .catch((err) => {
                    console.error('Clipboard copy failed:', err);
                    alert('Copy failed. Please try again or use your browser clipboard directly.');
                });
        }
        
        async function askOllama() {
            const startTime = Date.now();

            const promptInput = document.getElementById('prompt');
            const resultDiv = document.getElementById('result');
            const submitBtn = document.getElementById('submitBtn');
            
            const prompt = promptInput.value.trim();
            if (!prompt) {
                alert("Please enter a question.");
                return;
            }

            // Remove any previous diagnostic displays
            const existingDiagnostics = document.querySelectorAll('[data-diagnostic]');
            existingDiagnostics.forEach(el => el.remove());

            // UI Updates
            resultDiv.style.display = 'block';
            resultDiv.innerHTML = '<div class="answer-meta"><span id="streamingTime">Thinking & Streaming a response...</span><span id="tokenInfo" style="margin-left: 1rem;"></span></div><hr><div id="answerText"><font size="3"></font></div>';
            submitBtn.disabled = true;

            let currentModel = 'local-model'; // Default model name
            let inputTokens = 0;
            let outputTokens = 0;

            try {
                // Get the current model from LM Studio
                const modelResponse = await fetch('http://localhost:1234/v1/models');
                if (modelResponse.ok) {
                    const modelData = await modelResponse.json();
                    if (modelData.data && modelData.data.length > 0) {
                        currentModel = modelData.data[0].id;
                    }
                }

                // Find similar conversations using vector similarity
                let chatHistory = '';
                if (fileHandle && dbInitialized) {
                    try {
                        const similarConversations = await findSimilarConversations(prompt, 5, 0.3);
                        
                        if (similarConversations.length > 0) {
                            // Display diagnostic information on screen
                            let diagnosticHtml = '<div data-diagnostic style="background-color: #e8f4f8; border: 2px solid #0066cc; padding: 15px; margin: 10px 0; border-radius: 5px;">';
                            diagnosticHtml += '<h3 style="margin-top: 0; color: #0066cc;">🔍 Similarity Search Results</h3>';
                            diagnosticHtml += `<p><strong>Found ${similarConversations.length} relevant conversation(s) for context:</strong></p>`;
                            
                            similarConversations.forEach((conv, index) => {
                                diagnosticHtml += `<div style="background-color: white; padding: 10px; margin: 10px 0; border-left: 4px solid #0066cc;">`;
                                diagnosticHtml += `<strong>Match ${index + 1} - Similarity: ${(conv.similarity * 100).toFixed(1)}%</strong><br>`;
                                diagnosticHtml += `<strong>ID:</strong> ${conv.id}<br>`;
                                diagnosticHtml += `<pre style="white-space: pre-wrap; background-color: #f5f5f5; padding: 10px; margin-top: 5px;">${conv.comboHistory}</pre>`;
                                diagnosticHtml += `</div>`;
                            });
                            
                            diagnosticHtml += '</div>';
                            
                            // Insert diagnostic display before the result div
                            const resultDiv = document.getElementById('result');
                            resultDiv.insertAdjacentHTML('beforebegin', diagnosticHtml);
                            
                            // Build chat history for AI context
                            chatHistory = '\n\nRelevant conversation history (based on similarity):\n';
                            similarConversations.forEach((conv, index) => {
                                chatHistory += `\n[Similarity: ${(conv.similarity * 100).toFixed(1)}%]\n`;
                                chatHistory += conv.comboHistory + '\n';
                            });
                            console.log(`Loaded ${similarConversations.length} similar conversations for context`);
                        } else {
                            console.log('No similar conversations found');
                            // Display message when no matches found
                            const resultDiv = document.getElementById('result');
                            resultDiv.insertAdjacentHTML('beforebegin',
                                '<div data-diagnostic style="background-color: #fff3cd; border: 2px solid #ffc107; padding: 15px; margin: 10px 0; border-radius: 5px;">' +
                                '<strong>ℹ️ No similar conversations found</strong> (similarity threshold: 30%)' +
                                '</div>'
                            );
                        }
                    } catch (err) {
                        console.log('Could not load similar conversations:', err);
                    }
                }


                // Fetch token information in parallel (non-streaming request)
                const tokenPromise = fetch('http://localhost:1234/v1/chat/completions', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        messages: [
                            { role: "system", content: `You are an LLM.  Filename: ${currentModel}${chatHistory}.  If you cannot find information to answer the question, please reply I don't know.` },
                            { role: "user", content: prompt }
                        ],
                        model: "local-model",
                        temperature: 0.7,
                        stream: false
                    })
                }).then(res => res.json()).catch(() => null);

                // Fetch request to local LM Studio instance with streaming enabled
                const response = await fetch('http://localhost:1234/v1/chat/completions', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        messages: [
                            { role: "system", content: `You are an LLM, Filename: ${currentModel}${chatHistory}` },
                            { role: "user", content: prompt }
                        ],
                        model: "local-model", // LM Studio ignores this and uses what is loaded
                        temperature: 0.7,
                        stream: true // Enable streaming
                    })
                });

                if (!response.ok) {
                    const errorText = await response.text();
                    throw new Error(`Server Error: ${response.status} - ${errorText}`);
                }

                // Read the streaming response
                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                const answerDiv = document.getElementById('answerText').querySelector('font');
                let completeText = '';

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    const chunk = decoder.decode(value);
                    const lines = chunk.split('\n');

                    for (const line of lines) {
                        if (line.startsWith('data: ')) {
                            const jsonStr = line.slice(6).trim();
                            if (jsonStr === '[DONE]') {
                                continue;
                            }
                            try {
                                const data = JSON.parse(jsonStr);
                                const content = data.choices[0].delta.content;
                                if (content) {
                                    completeText += content;
                                    answerDiv.textContent = completeText;
                                }
                            } catch (e) {
                                // Ignore JSON parse errors for incomplete lines
                            }
                        }
                    }
                }

                const laterTime = Date.now();
                const deltaSeconds = Math.round((laterTime - startTime) / 1000);

                // Update the timing display
                document.getElementById('streamingTime').textContent = `Time to complete: ${deltaSeconds} seconds`;

                // Get token information from the parallel request
                const tokenData = await tokenPromise;
                if (tokenData && tokenData.usage) {
                    const tokenInfo = document.getElementById('tokenInfo');
                    inputTokens = tokenData.usage.prompt_tokens;
                    outputTokens = tokenData.usage.completion_tokens;
                    tokenInfo.textContent = `  Tokens - Prompt: ${inputTokens}, Completion: ${outputTokens}`;
                    tokenInfo.style.color = '#666';
                    tokenInfo.style.fontSize = '0.9em';
                }

                // Generate embeddings for combo_history
                const comboHistory = `User: ${prompt}\nAI: ${completeText}`;
                const comboVector = await generateEmbeddings(comboHistory);
                
                if (comboVector) {
                    console.log('Embeddings generated successfully');
                } else {
                    console.log('Embeddings generation failed or not available');
                }

                // Save to database with embeddings
                await saveChatToDatabase(prompt, completeText, deltaSeconds, currentModel, inputTokens, outputTokens, comboVector || '');

            } catch (error) {
                console.error(error);
                let errorMsg = "Error: Could not connect to LM Studio.";
                
                if (error.message.includes("Failed to fetch")) {
                    errorMsg += " Ensure your LM Studio server is running and CORS is enabled.";
                } else {
                    errorMsg += error.message;
                }
                
                resultDiv.innerHTML = `<span style="color: red;">${errorMsg}</span>`;
            } finally {
                submitBtn.disabled = false;
            }
        }
    </script>
